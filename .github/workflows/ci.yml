name: CI

on:
  push:
    branches: [main, 'rebuild/**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: build / typecheck / test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build MUST run first. Packages use TS project references and resolve
      # each other via their built dist/ (package.json `types` -> dist/index.d.ts).
      # `pnpm -r build` compiles in topological order (core -> mcp -> cma-tools),
      # emitting the dist/ that the typecheck and test steps then rely on. Running
      # typecheck before build fails with "Cannot find module '@limner/core'" in a
      # clean checkout, because no dist/ exists yet.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test
