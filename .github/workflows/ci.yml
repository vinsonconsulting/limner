name: CI

on:
  push:
    branches: [main, 'rebuild/**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: build / typecheck / test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A7: root package.json `version` is the single source of truth. Regenerate
      # the derived version sites (generated version.ts, manifest.json, the
      # sub-package versions) and fail if anything drifted — i.e. the root
      # version was bumped without running `pnpm sync-version`. r2 extends the
      # same drift check to the packaging sync (embedded schema + license copies).
      - name: Generated-files drift check (version + packaging)
        run: |
          node scripts/sync-version.mjs
          node scripts/sync-packaging.mjs
          git diff --exit-code

      # Lint runs before build — typescript-eslint parses the source directly,
      # so it needs no dist/.
      - name: Lint
        run: pnpm lint

      # Build MUST run first. Packages use TS project references and resolve
      # each other via their built dist/ (package.json `types` -> dist/index.d.ts).
      # `pnpm -r build` compiles in topological order (core -> mcp -> cma-tools),
      # emitting the dist/ that the typecheck and test steps then rely on. Running
      # typecheck before build fails with "Cannot find module '@limner/core'" in a
      # clean checkout, because no dist/ exists yet.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      # Tests + coverage in one pass (vitest --coverage runs the suite).
      - name: Test (with coverage)
        run: pnpm test:coverage

      # RT-3 artifact matrix — exercise every shipping surface on each PR, not
      # only at release. (1) Workers config validity via a deploy dry-run on the
      # dev (top-level) and production environments; catches a malformed
      # binding/trigger before merge. The dry-run is local: no Cloudflare auth
      # and no resource-existence check. (2) The .mcpb bundle validates + packs
      # here; build-mcpb.yml otherwise only runs on release tags.
      - name: Workers config dry-run (dev + production)
        working-directory: packages/limner-mcp
        run: |
          pnpm exec wrangler deploy --dry-run
          pnpm exec wrangler deploy --dry-run --env production

      - name: Validate + pack .mcpb bundle
        run: |
          ./packages/limner-mcp/node_modules/.bin/mcpb validate packages/limner-mcp/manifest.json
          node scripts/pack-mcpb.mjs "$RUNNER_TEMP/limner-mcp.mcpb"

      # r2: BOOT the packed artifact, not just pack it. Unzips to a temp dir
      # outside the repo and drives tools/list over stdio with no
      # LIMNER_SCHEMA_PATH — the embedded-schema default and the full bundled
      # dependency closure must hold, exactly like an end-user install.
      - name: Smoke packed .mcpb (boot + tools/list)
        run: node scripts/smoke-mcpb.mjs "$RUNNER_TEMP/limner-mcp.mcpb"
