name: Integration

# Runs *.integration.test.ts against real upstream APIs. Manual-trigger only
# to avoid burning API credits on every push. See packages/limner-core/README.md
# for the gh secret set commands maintainers run once to populate keys.
#
# Each test describes.skipIf()s its own required env var, so this workflow
# is safe to run before any secrets are populated -- skipped tests count
# as a pass.

on:
  workflow_dispatch:

# Don't cancel in-progress integration runs on new triggers -- they cost
# money and partial state is awkward to reason about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    name: Run integration tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # RETRODIFFUSION_API_KEY removed: D-RA-18 moved RetroDiffusion
          # out of rasa to limner-pixel.
          RECRAFT_API_KEY: ${{ secrets.RECRAFT_API_KEY }}
          # Phase 3 (D-RA-16): cf-images-transform integration test.
          # Stub-with-gate until Phase 4 wires the IMAGES binding via
          # wrangler.toml on the rasa zone. Maintainers populate via:
          #   gh secret set CLOUDFLARE_API_TOKEN --body "..."
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @limner/core test:integration
