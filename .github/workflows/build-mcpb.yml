name: Build MCPB

# Packs the @limner/mcp package as a .mcpb bundle on tagged releases.
# Tag format: mcpb-v1.0.0 (matches `mcpb-v*`). Uploads the resulting
# .mcpb file as a GitHub release asset.
#
# Refs: D-RA-05 (MCPB is one of the three v1 transports)

on:
  push:
    tags:
      - 'mcpb-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to associate with the build (e.g. mcpb-v1.0.0). Used for the release asset name only when running via workflow_dispatch.'
        required: false
        default: 'mcpb-dev'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    name: Build and pack .mcpb bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Pack .mcpb bundle
        run: |
          cd packages/limner-mcp
          ./node_modules/.bin/mcpb pack . ../../limner-mcp.mcpb

      - name: Validate the packed manifest
        run: ./packages/limner-mcp/node_modules/.bin/mcpb validate packages/limner-mcp/manifest.json

      - name: Upload bundle as workflow artifact (always)
        uses: actions/upload-artifact@v7
        with:
          name: limner-mcp.mcpb
          path: limner-mcp.mcpb

      - name: Upload bundle to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/mcpb-v')
        uses: softprops/action-gh-release@v3
        with:
          files: limner-mcp.mcpb
          name: ${{ github.ref_name }}
          generate_release_notes: true
