name = "limner-mcp"
main = "src/worker.ts"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

# Phase 4 (D-RA-04, D-RA-06, D-RA-16) bindings.

# D1 — durable state (memory, projects, sessions). Schema source of
# truth at <repo-root>/migrations/0001_initial_schema.sql; consumed by
# both `wrangler d1 migrations apply` and createLocalBindings's
# schemaPath in stdio mode.
[[d1_databases]]
binding = "DB"
database_name = "limner-rasa-dev"
# database_id intentionally omitted. scripts/setup-cloudflare.mjs provisions
# the database and pins the id here; a bare `wrangler deploy` (or the Deploy
# to Cloudflare button) auto-provisions instead and, when run locally, writes
# the id back to this file.
migrations_dir = "../../migrations"

# KV — OAuth token storage for workers-oauth-provider (Step 8).
# Per D-RA-06: Cloudflare KV (encrypted at rest). The binding MUST be
# named `OAUTH_KV` — that's the name workers-oauth-provider looks up
# at runtime (per its README).
[[kv_namespaces]]
binding = "OAUTH_KV"
# id intentionally omitted — see the note on the D1 binding above.

# Cloudflare Images Transformations binding (D-RA-16). Used by the
# compose tool's cf-images-* ops (cfTransform / cfOverlay / cfBlur /
# cfSmartCrop / cfBackgroundFill).
#
# Requires Images Transformations to be enabled on the account; if
# disabled at deploy time, ctx.images stays undefined and the compose
# handler returns 'unsupported_in_stdio' (or its Workers equivalent)
# rather than crashing.
[images]
binding = "IMAGES"

# Durable Object — McpAgent class for Phase 6c. Backed by SQLite (per
# new_sqlite_classes migration below). One DO instance per Mcp-Session-Id,
# keyed by Anthropic's session header so the SDK's Transport state actually
# persists across `initialize → notifications/initialized → tools/list →
# tools/call`. See packages/limner-mcp/src/worker.ts (LimnerMCP class).
[[durable_objects.bindings]]
name = "LIMNER_MCP"
class_name = "LimnerMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LimnerMCP"]

# RT-1 — Workers Rate Limiting binding. Meters the /mcp tool-call surface
# per caller (src/rate-limit.ts) before requests reach the DO/D1/pipeline
# layer. namespace_id is an account-scoped counter id (not a provisioned
# resource); dev and prod use distinct ids so their counters stay isolated.
# `period` must be 10 or 60. Counters are per-Cloudflare-location.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

# RT-2 (D-RA-20) — R2 bucket for image artifacts. The operator creates the
# bucket at deploy time (`wrangler r2 bucket create limner-rasa-artifacts-dev`
# or the dashboard); the binding name BUCKET matches @limner/cma-tools'
# uploadImageToR2. Retention is enforced by the scheduled() sweep below, NOT a
# native lifecycle rule (the deploy token lacks the r2 management scope).
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "limner-rasa-artifacts-dev"

# PR D — R2 bucket for generated assets returned as URLs (separate from the
# compose-artifacts BUCKET above). The operator creates it once, like BUCKET:
#   wrangler r2 bucket create limner-rasa-generated-dev
# Swept by the same 30-day retention cron (scheduled() in src/worker.ts).
[[r2_buckets]]
binding = "GENERATED_BUCKET"
bucket_name = "limner-rasa-generated-dev"

# PR D — absolute base for artifact URLs. Dev serves from wrangler dev's local
# origin (override via .dev.vars for a tunnelled dev deploy). Delivery is active
# only when GENERATED_BUCKET *and* ARTIFACT_BASE_URL are both present; otherwise
# image tools fall back to inline base64.
[vars]
ARTIFACT_BASE_URL = "http://localhost:8787"
# D-RA-22 — comma-separated allowlist of first-party OAuth client_ids that skip
# the consent screen and auto-approve (agent-compat). Empty here for the local
# dev surface; the operator pins the live agent's DCR client_id in
# [env.production.vars] at deploy time. A client_id is public (A4-safe to commit).
OAUTH_TRUSTED_CLIENT_IDS = ""
# D-RA-22 — durable agent-compat: comma-separated redirect_uris that skip consent
# and auto-approve. The live agent's first-party client keeps a STABLE
# redirect_uri while its client_id rotates, so this (not the id allowlist) is what
# keeps it working. Empty for local dev; pinned in [env.production.vars].
OAUTH_TRUSTED_REDIRECT_URIS = ""

# RT-2 (D-RA-20) — daily cron driving the 30-day R2 retention sweep
# (src/retention.ts, invoked from the scheduled() handler in src/worker.ts).
[triggers]
crons = ["0 3 * * *"]

# Pipeline credentials live in Cloudflare Secrets, not wrangler.toml.
# Operator runs (once per environment):
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put RECRAFT_API_KEY

# ---------------------------------------------------------------------------
# Production environment (Phase 6). `wrangler deploy --env production` uses
# these; top-level config above stays the dev surface (wrangler dev --local).
#
# Resource ids below are intentionally omitted — scripts/setup-cloudflare.mjs
# --env production provisions the resources and pins the real ids.
#
# R2 (RT-2 / D-RA-20): BUCKET binding added for image-artifact retention.
# The @limner/mcp tools still return images inline as base64; artifact-to-R2
# routing stays a @limner/cma-tools (Path A) concern. The scheduled() sweep
# hard-deletes objects older than 30 days.
# ---------------------------------------------------------------------------

# Keep the *.workers.dev URL enabled in production. The CMA agent's mcp_servers
# points at https://limner-mcp-production.jim-170.workers.dev/mcp, and wrangler
# 4.x DISABLES workers.dev by default when this key is absent — silently taking
# down that URL on the next deploy. Pin it true so a redeploy can't break it.
[env.production]
workers_dev = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "limner-rasa-prod"
migrations_dir = "../../migrations"

[[env.production.kv_namespaces]]
# Binding name MUST stay OAUTH_KV (workers-oauth-provider looks it up by
# name); only the underlying namespace id differs between dev and prod.
binding = "OAUTH_KV"

[env.production.images]
binding = "IMAGES"

# Phase 6c Durable Object — production scope.
# Wrangler does NOT inherit DO bindings/migrations across env scopes;
# they must be redeclared here. Migration tag "v1" is per-namespace and
# safely shared with the dev binding above.
[[env.production.durable_objects.bindings]]
name = "LIMNER_MCP"
class_name = "LimnerMCP"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["LimnerMCP"]

# RT-1 — production rate limiter; distinct namespace_id so prod counters are
# isolated from dev.
[[env.production.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 100, period = 60 }

# RT-2 (D-RA-20) — production R2 bucket + retention cron. The operator creates
# the bucket once: `wrangler r2 bucket create limner-rasa-artifacts-prod`.
[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "limner-rasa-artifacts-prod"

# PR D — production generated-assets bucket. Operator creates it once:
#   wrangler r2 bucket create limner-rasa-generated-prod
[[env.production.r2_buckets]]
binding = "GENERATED_BUCKET"
bucket_name = "limner-rasa-generated-prod"

# PR D — artifact URL base. mcp.limner.us is the product domain (D-RA-13), not
# an account id (A4-safe). Artifact URLs resolve only when that host serves the
# worker: either activate the [[env.production.routes]] below (+ the DNS AAAA
# record) or override ARTIFACT_BASE_URL via the dashboard to the active host.
# Optional signed URLs: `wrangler secret put ARTIFACT_SIGNING_KEY --env production`.
[env.production.vars]
ARTIFACT_BASE_URL = "https://mcp.limner.us"
# D-RA-22 — first-party client allowlist (see top-level [vars] note). The
# operator pins the live CMA agent's DCR-issued client_id here during the gated
# deploy (recover it via OAuthHelpers.listClients() / listUserGrants, or a
# wrangler kv read of OAUTH_KV) so its fresh re-auth auto-approves and never
# hits the consent screen. A client_id is public — safe to commit.
OAUTH_TRUSTED_CLIENT_IDS = ""
# D-RA-22 — the live agent's first-party "Claude" client registers with this
# stable redirect_uri (its client_id rotates, so this is the durable trust
# signal). Auto-approving it is safe: the auth code is only ever delivered to
# claude.ai (Anthropic). This also auto-approves Claude.ai connector users; only
# genuinely third-party clients see the consent screen. A redirect_uri is public.
OAUTH_TRUSTED_REDIRECT_URIS = "https://claude.ai/api/mcp/auth_callback"

[env.production.triggers]
crons = ["0 3 * * *"]

# Custom domain (optional). By default the deployed Worker serves from its
# workers.dev URL. To attach your own hostname, add a route for a zone on
# your account:
#
#   [[env.production.routes]]
#   pattern = "mcp.example.com/*"
#   zone_name = "example.com"
#
# With a *route* (vs custom_domain = true) the only manual step is the DNS
# record: in your zone, add a PROXIED (orange-cloud) AAAA record
# mcp -> 100:: — a placeholder target, since the Worker is the handler and
# there is no real origin. Once that record exists,
# `wrangler deploy --env production` attaches the route.
# (Alternative: `custom_domain = true` auto-creates the DNS + cert, no manual DNS.)

# Prod secrets (operator runs once):
#   wrangler secret put OPENAI_API_KEY  --env production
#   wrangler secret put RECRAFT_API_KEY --env production
#   wrangler secret put OAUTH_CONSENT_SIGNING_KEY --env production
# (D-RA-22) OAUTH_CONSENT_SIGNING_KEY signs the consent CSRF token. Required on
# a public deploy: without it the consent flow fails closed for non-trusted
# clients (503). Generate 32+ random bytes; pipe over stdin, never echo.

# ===========================================================================
# Dev environment — a REAL deployed dev target for the testing phases.
# `wrangler deploy --env dev` deploys the Worker as `limner-mcp-dev` at
# https://dev.mcp.limner.us (custom-domain parity with prod). The TOP-LEVEL
# config above stays the `wrangler dev --local` surface; this section is the
# deployed dev twin of [env.production], with dev-scoped resources.
#
# Resource ids below are intentionally omitted (A4) — pinned at deploy:
#   D1  limner-rasa-dev          (exists)        -> pin its database_id
#   KV  OAUTH_KV (dev namespace) (create once)   -> `wrangler kv namespace create OAUTH_KV --env dev`
#   R2  limner-rasa-artifacts-dev / limner-rasa-generated-dev (exist)
# Dev secrets (operator runs once, dev-specific values, over stdin):
#   wrangler secret put OPENAI_API_KEY           --env dev
#   wrangler secret put RECRAFT_API_KEY          --env dev
#   wrangler secret put ARTIFACT_SIGNING_KEY     --env dev
#   wrangler secret put OAUTH_CONSENT_SIGNING_KEY --env dev
# DNS (manual, once): in the limner.us zone add a PROXIED (orange-cloud) AAAA
# record  mcp-dev -> 100::  so the route below attaches on deploy.
# ===========================================================================

# Keep the *.workers.dev URL enabled for dev too (parity with prod).
[env.dev]
workers_dev = true

[[env.dev.d1_databases]]
binding = "DB"
database_name = "limner-rasa-dev"
migrations_dir = "../../migrations"

[[env.dev.kv_namespaces]]
# Binding name MUST stay OAUTH_KV. Use a DEV-scoped namespace (create once),
# isolated from prod's OAUTH_KV — never share the prod OAuth store with dev.
binding = "OAUTH_KV"

[env.dev.images]
binding = "IMAGES"

# Durable Object — dev scope (redeclared; wrangler doesn't inherit across envs).
# Migration tag "v1" is per-namespace and safely shared with the other scopes.
[[env.dev.durable_objects.bindings]]
name = "LIMNER_MCP"
class_name = "LimnerMCP"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["LimnerMCP"]

# RT-1 — dev rate limiter; distinct namespace_id (1003) so dev counters stay
# isolated from local (1001) and prod (1002).
[[env.dev.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 100, period = 60 }

[[env.dev.r2_buckets]]
binding = "BUCKET"
bucket_name = "limner-rasa-artifacts-dev"

[[env.dev.r2_buckets]]
binding = "GENERATED_BUCKET"
bucket_name = "limner-rasa-generated-dev"

# dev.mcp.limner.us is a public product subdomain (A4-safe). A real https origin,
# so it exercises the signed-artifact fail-closed path exactly like prod.
[env.dev.vars]
ARTIFACT_BASE_URL = "https://dev.mcp.limner.us"
# Dev does not serve the live agent, so no first-party allowlist is needed here.
OAUTH_TRUSTED_CLIENT_IDS = ""
OAUTH_TRUSTED_REDIRECT_URIS = ""

[env.dev.triggers]
crons = ["0 3 * * *"]

# Custom-domain route — attaches once the mcp-dev AAAA record exists (see above).
[[env.dev.routes]]
pattern = "dev.mcp.limner.us/*"
zone_name = "limner.us"
