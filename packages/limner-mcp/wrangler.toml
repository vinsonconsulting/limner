name = "limner-mcp"
main = "src/worker.ts"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

# Phase 4 (D-RA-04, D-RA-06, D-RA-16) bindings.

# D1 — durable state (memory, projects, sessions). Schema source of
# truth at <repo-root>/migrations/0001_initial_schema.sql; consumed by
# both `wrangler d1 migrations apply` and createLocalBindings's
# schemaPath in stdio mode.
[[d1_databases]]
binding = "DB"
database_name = "limner-rasa-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations"

# KV — OAuth token storage for workers-oauth-provider (Step 8).
# Per D-RA-06: Cloudflare KV (encrypted at rest). The binding MUST be
# named `OAUTH_KV` — that's the name workers-oauth-provider looks up
# at runtime (per its README).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "00000000000000000000000000000000"

# Cloudflare Images Transformations binding (D-RA-16). Used by the
# compose tool's cf-images-* ops (cfTransform / cfOverlay / cfBlur /
# cfSmartCrop / cfBackgroundFill).
#
# Requires Images Transformations to be enabled on the account; if
# disabled at deploy time, ctx.images stays undefined and the compose
# handler returns 'unsupported_in_stdio' (or its Workers equivalent)
# rather than crashing.
[images]
binding = "IMAGES"

# Pipeline credentials live in Cloudflare Secrets, not wrangler.toml.
# Operator runs (once per environment):
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put RECRAFT_API_KEY

# ---------------------------------------------------------------------------
# Production environment (Phase 6). `wrangler deploy --env production` uses
# these; top-level config above stays the dev surface (wrangler dev --local).
#
# Resources provisioned 2026-05-26:
#   D1  limner-rasa-prod   00000000-0000-0000-0000-000000000000  (schema applied)
#   KV  OAUTH_KV_PROD      00000000000000000000000000000000
#
# No R2 binding: @limner/mcp returns images inline as base64; R2 is a
# @limner/cma-tools (Path A) concern that lands with Phase 7 deploy work.
# ---------------------------------------------------------------------------
[[env.production.d1_databases]]
binding = "DB"
database_name = "limner-rasa-prod"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations"

[[env.production.kv_namespaces]]
# Binding name MUST stay OAUTH_KV (workers-oauth-provider looks it up by
# name); only the underlying namespace id differs between dev and prod.
binding = "OAUTH_KV"
id = "00000000000000000000000000000000"

[env.production.images]
binding = "IMAGES"

# Prod secrets (operator runs once):
#   wrangler secret put OPENAI_API_KEY  --env production
#   wrangler secret put RECRAFT_API_KEY --env production
